version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: retailpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retailpulse
      POSTGRES_PASSWORD: retailpulse_dev_pw
      POSTGRES_DB: retailpulse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Anything in this init folder runs automatically, in filename
      # order, the FIRST time the container starts with an empty volume.
      - ../ingestion/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailpulse -d retailpulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - retailpulse-net

volumes:
  pgdata:

networks:
  retailpulse-net:
    external: true